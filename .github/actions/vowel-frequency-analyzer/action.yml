
name: Vowel Frequency Analyzer

description: Analyzes vowel frequencies in a text file using Docker.

inputs:
  file:
    description: Path to the text file to analyze
    required: true
    default: data.txt

  github-user:
    description: GitHub username of the contributor
    required: true

runs:
  using: docker
  image: ../../../Dockerfile
  env:
    FILE: ${{ inputs.file }}
    GITHUB_USER: ${{ inputs.github-user }}
