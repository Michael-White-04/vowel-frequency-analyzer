
name: CI Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker Image
        run: docker build -t vowel-frequency-analyzer:latest .

      - name: Run Custom Vowel Frequency Action
        uses: ./.github/actions/vowel-frequency-analyzer
        with:
          file: data.txt

      - name: Verify Analysis Results
        run: |
          cat README.md
          grep -F "'a': 2, 'e': 2, 'i': 2, 'o': 2, 'u': 2" README.md

      - name: Commit and Push Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update README with vowel frequency results"
            git pull --rebase origin main
            git push origin main
          fi
